<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="static/css/global.css">
    <link rel="stylesheet" href="static/css/mobile-first.css">
    <link rel="stylesheet" href="static/css/media-query.css">
    
    <script defer type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script defer nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <script defer src="static/js/password.js"></script>
</head>
<body>
    <main>
        <div class="title">
            <h1>Login</h1>
            <p>Entre na sua conta</p>
        </div>
        <form action="#">
            <div class="input-box">
                <span class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </span>
                <input 
                type="email" name="email" id="email"
                placeholder=" "
                value=""
                required
                >
                <label for="email">
                    E-mail
                </label>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                <input 
                type="password" name="password" id="password"   
                class="password"
                placeholder=" "
                value=""
                required
                >
                <ion-icon 
                    class="toggle-pwd-icon" 
                    id="showPwd" 
                    name="eye-outline">
                </ion-icon>
                <ion-icon 
                    class="toggle-pwd-icon"
                    id="hidePwd"
                    name="eye-off-outline">
                </ion-icon>
                <label for="password">
                    <span>Senha</span>
                </label>
            </div>
            <div class="remember-forgot">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>
                <a href="#">Esqueci minha senha</a>
            </div>
            <button type="submit">
                Enviar
            </button>
            <div class="register">
                <p>Não tem uma conta? <a href="#">Crie agora</a></p>
            </div>
        </form>
    </main>
</body>

</html>
